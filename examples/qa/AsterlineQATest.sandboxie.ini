; EXAMPLE ONLY. Do not overwrite your real Sandboxie.ini with this file.
; Add the QA-box settings through Sandboxie Plus > Sandbox Options > Edit ini Section.
[GlobalSettings]
NetworkEnableWFP=y

[AsterlineQATest]
AutoRecover=n
BlockNetworkFiles=y
AllowNetworkAccess=n
NetworkAccess=*,Block
BlockLocalLoop=y
; Add CLOSED access (not Read-Only) for your actual QA marker directory:
ClosedFilePath=C:\Users\YourName\AsterlineQA_Private\
; Keep result paths virtualized. Never OpenFilePath/DirectAccess the whole project/profile.
